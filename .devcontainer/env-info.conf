# Attach banner configuration, read by the devbase Feature this repository ships.
#
# It is also the reference example of the file: if a change to env-info.sh breaks the
# config format, it breaks here first.

TITLE="Devcontainer Features - development environment"

# Node is the only runtime this repository needs — it drives the devcontainer CLI and
# prettier. The others are suppressed rather than left on "auto" so the banner does not
# grow a PHP or Python section if a base image happens to ship one; nothing here builds
# against them, so reporting them would be misleading.
SHOW_NODE=auto
SHOW_PHP=false
SHOW_GO=false
SHOW_PYTHON=false
SHOW_JAVA=false

# The devcontainer CLI is what runs `pnpm features:test`, so its version is the single
# most useful thing to see on attach — a test failure that only happens locally is
# usually a CLI version difference.
#
# `devcontainer --version` prints a bare version on one line, which is why it needs no
# field index. Not every tool is so obliging: `docker --version` prints
# "Docker version 28.5.1, build …", where field 3 still carries a trailing comma, and
# `shellcheck --version` puts its version on the *second* line, out of reach of a
# first-line probe. Both are better read by hand than shown here badly.
EXTRA_ROWS="devcontainer CLI|devcontainer --version|"

# Installed dependency versions, read from node_modules — an empty row means
# `pnpm install` has not run.
NODE_DEPS="@devcontainers/cli prettier"
COMPOSER_DEPS=""
