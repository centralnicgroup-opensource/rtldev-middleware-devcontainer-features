name: Release
"on":
  push:
    branches:
      - main

permissions:
  contents: read

# Release and publish are one job on purpose.
#
# semantic-release bumps `version` in devcontainer-feature.json (via the replace plugin)
# and commits it with @semantic-release/git. That commit is pushed with GITHUB_TOKEN, and
# pushes made with GITHUB_TOKEN do not trigger workflows — so a separate publish workflow
# listening on `push` would never fire for exactly the commit that matters. Publishing in
# the same job, after semantic-release has run, is what makes the bumped version the one
# that reaches ghcr.io.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release commits the version bump and creates the release
      issues: write
      pull-requests: write
      packages: write # pushes the Feature artifacts to ghcr.io
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release reads the full history to work out the next version.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_NOTIFICATION_URI: ${{ secrets.TEAMS_NOTIFICATION_URI }}
        run: pnpm exec semantic-release

      # The working tree now carries whatever version semantic-release decided on, so the
      # publish below ships that. Publishing is idempotent — a version already present in
      # the registry is skipped, not overwritten — so a run in which semantic-release
      # released nothing is a harmless no-op rather than something to guard with an `if`.
      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: features/src
          generate-docs: "true"
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # generate-docs writes the per-feature README.md but does not push it.
      - name: Push generated documentation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add features/
            git commit -m "docs(features): regenerate feature documentation [skip ci]"
            git push
          else
            echo "No documentation changes to push."
          fi
